name: Testing

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '*'
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

# a new push to a branch cancels the runs that are still going for it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # the newest python can fail for a while for want of wheels of what it needs (numpy, Cython): it does not fail the run
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is an intel runner, macos-latest is apple silicon
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create the environment
        # the build tools are installed in it (the `dev` group of pyproject.toml), as the package is built without isolation
        run: |
          uv venv
          uv pip install --group dev

      - name: Install our package
        # the visual studio compilers on windows, for compatibility with the python build
        run: |
          uv pip install --no-build-isolation --verbose --editable . \
            -Ccompile-args=-v \
            ${{ matrix.os == 'windows-latest' && '-Csetup-args=--vsenv' || '' }}

      - name: Show the environment
        run: |
          uv --version
          uv pip list

      - name: Run tests
        run: uv run --no-sync pytest -vv
