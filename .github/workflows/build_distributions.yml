name: Build Distribution artifacts

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is an intel runner, macos-latest is apple silicon
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # the build frontend is uv (see pyproject.toml): it has to be on the PATH of the windows and macos runners
      - uses: astral-sh/setup-uv@v7

      - name: Build wheels
        # (the settings, and the tests that the wheels are run through, are in pyproject.toml)
        uses: pypa/cibuildwheel@v4.3.0

      - uses: actions/upload-artifact@v5
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  test_abi3_wheel:
    # The cp312 wheel is an abi3 wheel (see [tool.meson-python] in pyproject.toml): it has to work on every newer GIL-enabled
    # CPython too, but cibuildwheel only tests it on 3.12. Install the wheel that was built on linux in the newer ones.
    name: Test the abi3 wheel on Python ${{ matrix.python }} (${{ matrix.os }})
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v5
        with:
          pattern: cibw-wheels-${{ matrix.os }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Install the wheel and run the tests
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} --allow-existing .venv-abi3
          source .venv-abi3/bin/activate 2>/dev/null || source .venv-abi3/Scripts/activate
          # (linux makes a musllinux wheel besides the manylinux one: take the one that runs on these runners)
          wheel=$(ls wheelhouse/*-cp312-abi3-*.whl | grep -v musllinux | head -n 1)
          echo "testing $wheel"
          uv pip install pytest "$wheel"
          # run from outside of the source tree, so that the wheel is what is imported
          mkdir ../run && cp -r tests examples ../run && cd ../run
          python -m pytest tests

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v5
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  pypi-publish:
    name: Upload release to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/seismic-python
    permissions:
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: ./dist/
          verbose: true
          print-hash: true
