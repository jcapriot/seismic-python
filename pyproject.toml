[build-system]
build-backend = 'mesonpy'
requires = [
    "meson-python>=0.21.0",
    "Cython>=3.1.0",

    # numpy requirement for wheel builds for distribution on PyPI - building
    # against 2.x yields wheels that are also compatible with numpy 1.x at
    # runtime.
    "numpy>=2.0.0rc1",
]

[project]
name = 'seismic-python'
dynamic = ["version"]
description = 'Wavefield Imaging'
readme = 'README.md'
requires-python = '>=3.12'
authors = [
  {name = 'Joseph Capriotti', email = 'josephrcapriotti@gmail.com'},
]
keywords = [
    'SeismicUnix', 'wavefield', 'imaging', 'seismic', 'gpr',
]

# Note: Python and NumPy upper version bounds should be set correctly in
# release branches, see:
#     https://scipy.github.io/devdocs/dev/core-dev/index.html#version-ranges-for-numpy-and-other-dependencies
dependencies = [
    # TODO: update to "pin-compatible" once possible, see
    # https://github.com/mesonbuild/meson-python/issues/29
    "numpy>=1.26.0",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Natural Language :: English",
]

[project.optional-dependencies]
# for seispy.plotting (and the examples)
plot = [
    "matplotlib",
]

[project.license]
file = 'LICENSE.md'

[project.urls]
Homepage = 'http://github.com/jcapriot/seismic-python'
Repository = 'http://github.com/jcapriot/seismic-python.git'

[tool.meson-python]
# Build one abi3 wheel per platform (targeting the 3.12 limited API, see meson.build) instead of one per Python version.
# Free-threaded builds opt out with `-Dpython.allow_limited_api=false`: 3.14t has no stable ABI at all, and Cython can not
# yet generate code for the one of 3.15t (abi3t). Revisit once Cython can.
limited-api = true

[tool.meson-python.args]
setup = ['--default-library=static']

[dependency-groups]
test = [
    "pytest",
]
# what is needed to build the package without build isolation, and to test it: `uv pip install --group dev`
dev = [
    {include-group = "test"},
    "meson-python>=0.21.0",
    "meson",
    "ninja",
    "Cython>=3.1.0",
    "numpy>=2.0.0",
]

[tool.cibuildwheel]
# cp312-* is the abi3 wheel that covers every GIL-enabled CPython >= 3.12 (and is tested here on 3.12 only: the
# workflow tests the wheel with the newer ones). The free-threaded builds are ordinary per-version wheels (see the
# override below). Skip 32 bit windows.
build = ["cp312-*", "cp314t-*", "cp315t-*"]
skip = ["*-win32"]
build-frontend = "build[uv]"
build-verbosity = 1
# use the visual studio compilers on windows (a no-op elsewhere)
config-settings = { setup-args = ["--vsenv"] }

# Test every wheel that is built with the whole test suite. The tests are run from a temporary directory outside of the source
# tree, so that the package that is imported is the wheel. (The tests of the examples run the examples.)
test-requires = ["pytest"]
test-sources = ["tests", "examples"]
test-command = "pytest tests"

[[tool.cibuildwheel.overrides]]
# Free-threaded builds use the regular (non-limited) API, see [tool.meson-python]. The base setup-args are repeated here
# because an override replaces the whole key rather than adding to it.
select = ["cp314t-*", "cp315t-*"]
config-settings = { setup-args = ["--vsenv", "-Dpython.allow_limited_api=false"] }
